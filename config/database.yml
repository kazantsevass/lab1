default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("PGHOST", "localhost").to_json %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development: &local
  <<: *default
  username: <%= ENV.fetch("PGUSER", "postgres").to_json %>
  database: app1_development

test:
  <<: *local
  database: app1_test

production:
  primary: &production
    <<: *default
    database: app1_production
    username: <%= ENV.fetch("PGUSER", "app1").to_json %>
    password: <%= ENV["APP1_DATABASE_PASSWORD"]&.to_json || ENV["PGPASSWORD"]&.to_json %>
  cache:
    <<: *production
    database: app1_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *production
    database: app1_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *production
    database: app1_production_cable
    migrations_paths: db/cable_migrate
